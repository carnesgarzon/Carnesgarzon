<title>Tablero Carne de Res</title>

<style>
/* Layout: fondo con manchas de color (navy, verde, menta, oro) bajo paneles de vidrio esmerilado.
   Cabecera de vidrio con filtros → pestañas en píldora → vista: resumen arriba, detalle abajo. */
:root{
  --navy:#13294B; --navy-2:#24508C; --green:#1E7A52; --gold:#B8890F; --gold-2:#C99A1A; --mint:#7FD4B8;
  --bg:#E8EFEE; --blob1:rgba(30,122,82,.20); --blob2:rgba(19,41,75,.18); --blob3:rgba(201,154,26,.16); --blob4:rgba(127,212,184,.34);
  --glass:rgba(255,255,255,.64); --glass-2:rgba(255,255,255,.44); --glass-line:rgba(255,255,255,.85); --edge:rgba(19,41,75,.10);
  --shadow:0 10px 30px rgba(19,41,75,.08), 0 1px 2px rgba(19,41,75,.06);
  --row:rgba(19,41,75,.07); --row-h:rgba(255,255,255,.55);
  --fg:#12201C; --fg-2:#45554F; --fg-3:#6F7F79; --on-hl:#FFFFFF; --on-hl-2:#C9D8F0;
  --hl-a:#13294B; --hl-b:#2A5A9A; --sel-bg:#13294B;
  --good:#17704A; --good-bg:rgba(30,122,82,.13); --warn:#8A5F00; --warn-bg:rgba(201,154,26,.18); --crit:#A8231C; --crit-bg:rgba(179,38,30,.11);
  --s1:#2F6DB5; --s2:#C99A1A; --s3:#1E9A64; --s4:#8467C9; --s5:#38B8C9; --sm:#9AA6A2; --sm2:#5F6E69;
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-num:Verdana,Geneva,"DejaVu Sans",sans-serif;
  --r:14px; --r-s:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0E1E36; --navy-2:#2A5A9A; --green:#3DB07C; --gold:#E0B84A; --gold-2:#D9B13A; --mint:#7FD4B8;
  --bg:#09131F; --blob1:rgba(61,176,124,.20); --blob2:rgba(42,90,154,.30); --blob3:rgba(217,177,58,.12); --blob4:rgba(127,212,184,.14);
  --glass:rgba(22,36,58,.60); --glass-2:rgba(22,36,58,.40); --glass-line:rgba(255,255,255,.09); --edge:rgba(0,0,0,.35);
  --shadow:0 10px 30px rgba(0,0,0,.30), 0 1px 2px rgba(0,0,0,.3);
  --row:rgba(255,255,255,.07); --row-h:rgba(255,255,255,.05);
  --fg:#E7EEF0; --fg-2:#AEBDC4; --fg-3:#7F909A; --on-hl:#FFFFFF; --on-hl-2:#BCD0EE;
  --hl-a:#1A3A66; --hl-b:#2F64AA; --sel-bg:#2F64AA;
  --good:#5BC793; --good-bg:rgba(91,199,147,.14); --warn:#E3B54A; --warn-bg:rgba(227,181,74,.15); --crit:#F08A80; --crit-bg:rgba(240,138,128,.14);
  --s1:#4D86D1; --s2:#B5891C; --s3:#1F9563; --s4:#8F78D8; --s5:#2A9DB0; --sm:#6E7D86; --sm2:#46535B; color-scheme:dark }}
:root[data-theme="dark"]{
  --navy:#0E1E36; --navy-2:#2A5A9A; --green:#3DB07C; --gold:#E0B84A; --gold-2:#D9B13A; --mint:#7FD4B8;
  --bg:#09131F; --blob1:rgba(61,176,124,.20); --blob2:rgba(42,90,154,.30); --blob3:rgba(217,177,58,.12); --blob4:rgba(127,212,184,.14);
  --glass:rgba(22,36,58,.60); --glass-2:rgba(22,36,58,.40); --glass-line:rgba(255,255,255,.09); --edge:rgba(0,0,0,.35);
  --shadow:0 10px 30px rgba(0,0,0,.30), 0 1px 2px rgba(0,0,0,.3);
  --row:rgba(255,255,255,.07); --row-h:rgba(255,255,255,.05);
  --fg:#E7EEF0; --fg-2:#AEBDC4; --fg-3:#7F909A; --on-hl:#FFFFFF; --on-hl-2:#BCD0EE;
  --hl-a:#1A3A66; --hl-b:#2F64AA; --sel-bg:#2F64AA;
  --good:#5BC793; --good-bg:rgba(91,199,147,.14); --warn:#E3B54A; --warn-bg:rgba(227,181,74,.15); --crit:#F08A80; --crit-bg:rgba(240,138,128,.14);
  --s1:#4D86D1; --s2:#B5891C; --s3:#1F9563; --s4:#8F78D8; --s5:#2A9DB0; --sm:#6E7D86; --sm2:#46535B; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(38rem 30rem at 8% 0%,var(--blob4),transparent 70%),radial-gradient(34rem 28rem at 95% 8%,var(--blob2),transparent 70%),
             radial-gradient(30rem 26rem at 70% 75%,var(--blob1),transparent 70%),radial-gradient(28rem 22rem at 12% 90%,var(--blob3),transparent 70%),var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.86em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border:1px solid var(--glass-line);box-shadow:var(--shadow);border-radius:var(--r)}

/* Cabecera */
header .wrap{padding-block:18px 10px}
.hdr{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;padding:16px 20px}
.brand{display:flex;flex-direction:column;gap:3px;margin-right:auto;min-width:0}
.brand small{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.brand h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;color:var(--fg)}
.brand h1 em{font-style:normal;color:var(--gold)}
.flt{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.flt label{display:flex;flex-direction:column;gap:3px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);font-weight:700}
.sel{background:var(--glass-2);border:1px solid var(--glass-line);box-shadow:inset 0 0 0 1px var(--edge);border-radius:999px;padding:7px 14px;min-width:160px;max-width:100%;font-weight:600;font-size:.88rem}
.chip{display:inline-flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:.8rem;color:var(--fg-2);background:var(--glass-2);border:1px solid var(--glass-line);box-shadow:inset 0 0 0 1px var(--edge);border-radius:999px;padding:6px 12px}
.chip b{color:var(--fg);font-family:var(--f-num);font-size:.92em}

/* Pestañas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:6px}
.tabs .bar{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:5px;border-radius:999px}
.tab{appearance:none;border:0;background:none;padding:8px 14px;border-radius:999px;font-family:var(--f-display);font-weight:600;font-size:.85rem;color:var(--fg-2);white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--fg);background:var(--row-h)}
.tab[aria-selected="true"]{background:var(--sel-bg);color:#fff;box-shadow:0 4px 12px rgba(19,41,75,.25)}
main .wrap{padding-block:12px 48px;display:flex;flex-direction:column;gap:22px}

/* Secciones */
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.sec-h h2{font-size:1.08rem;font-weight:700}
.sec-h p{margin:0;color:var(--fg-3);font-size:.85rem}
.pad{padding:16px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,185px),1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lb{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);font-weight:700}
.kpi .v{font-family:var(--f-num);font-size:1.5rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--fg);line-height:1.2}
.kpi .sb{font-size:.8rem;color:var(--fg-2);line-height:1.4}
.kpi .sb .num{font-size:.94em}
.kpi.hl{background:linear-gradient(135deg,var(--hl-a),var(--hl-b));border-color:transparent;color:var(--on-hl)}
.kpi.hl .lb,.kpi.hl .sb{color:var(--on-hl-2)} .kpi.hl .v{color:var(--on-hl)}
.v.good{color:var(--good)} .v.bad{color:var(--crit)}

/* Tablas */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-weight:700;text-align:left;color:var(--fg-3);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;padding:11px 10px;border-bottom:1px solid var(--row);white-space:nowrap}
th.n,td.n{text-align:right}
td{padding:8px 10px;border-bottom:1px solid var(--row);vertical-align:middle}
td:first-child{white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--row);background:var(--row-h)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--row-h)}
.barcell{display:flex;align-items:center;gap:8px;min-width:120px}
.barcell i{display:block;height:8px;border-radius:0 4px 4px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}

/* Estados */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap}
.pill.g{background:var(--good-bg);color:var(--good)} .pill.w{background:var(--warn-bg);color:var(--warn)} .pill.c{background:var(--crit-bg);color:var(--crit)} .pill.n{background:var(--row);color:var(--fg-2)}
.pill.g::before{content:"▲";font-size:.6rem} .pill.c::before{content:"▼";font-size:.6rem} .pill.w::before{content:"●";font-size:.55rem}
.note{font-size:.84rem;color:var(--fg-2);padding:12px 16px;display:flex;flex-direction:column;gap:5px}
.note b{color:var(--fg)}
.note.warn{background:var(--warn-bg);border-color:transparent;box-shadow:none}
.muted{color:var(--fg-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--fg-2)}

/* Píldoras de tienda */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pp{appearance:none;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px var(--edge);border-radius:999px;padding:7px 15px;font-weight:700;font-size:.85rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pp:hover{border-color:var(--fg-3)}
.pp[aria-pressed="true"]{background:var(--sel-bg);color:#fff;border-color:var(--sel-bg);box-shadow:0 6px 16px rgba(19,41,75,.28)}
.pp[disabled]{opacity:.45;cursor:not-allowed}
.pp sup{font-family:var(--f-num);font-size:.68rem;font-weight:700;opacity:.8}
.seg{display:inline-flex;padding:4px;border-radius:999px;gap:2px}
.seg button{appearance:none;border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--sel-bg);color:#fff;box-shadow:0 2px 8px rgba(19,41,75,.18)}

/* Grupos */
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.grp{padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.grp h3{font-size:.98rem;font-weight:700}
.grp .big{font-family:var(--f-num);font-size:1.55rem;font-weight:700;letter-spacing:-.02em}
.grp .track{height:8px;border-radius:999px;background:var(--row);overflow:hidden}
.grp .track i{display:block;height:100%;border-radius:999px}
.grp p{margin:0;font-size:.82rem;color:var(--fg-2);line-height:1.45}

/* Cascada */
.casc{display:flex;flex-direction:column;gap:12px}
.cbar{display:flex;height:34px;gap:2px;border-radius:9px;overflow:hidden}
.cbar span{display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:.76rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.cleg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px 16px;font-size:.82rem;color:var(--fg-2)}
.cleg b{display:block;font-family:var(--f-num);font-size:1.05rem;color:var(--fg)}

/* Despostes */
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.dcard{appearance:none;text-align:left;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0}
.dcard:hover{border-color:var(--green)}
.dcard[aria-pressed="true"]{box-shadow:0 0 0 2px var(--green),var(--shadow)}
.dcard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dcard .t{font-family:var(--f-display);font-weight:700}
.dcard .nm{font-size:.82rem;color:var(--fg-2);line-height:1.35}
.dcard dl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0}
.dcard dt{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:700}
.dcard dd{margin:0;font-family:var(--f-num);font-size:.9rem;font-weight:700}
.mix{display:flex;height:10px;gap:2px;border-radius:5px;overflow:hidden}
.mix span{display:block;height:100%}

/* Carga */
.drop{border:2px dashed var(--fg-3);border-radius:var(--r);padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.on{border-color:var(--green);background:var(--good-bg)}
.drop h3{font-size:1.1rem}
.btn{appearance:none;border:1px solid var(--glass-line);background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--fg-3)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 6px 16px rgba(30,122,82,.28)}
.btn.dng{color:var(--crit)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.log{font-size:.84rem;display:flex;flex-direction:column;gap:6px}
.log div{display:flex;gap:8px;align-items:baseline}
select.mini,input.mini{background:var(--glass-2);border:1px solid var(--glass-line);box-shadow:inset 0 0 0 1px var(--edge);border-radius:7px;padding:4px 6px;font-size:.84rem;max-width:100%}
input.mini{width:80px;text-align:right;font-family:var(--f-num)}
input.mini.wide{width:100%;text-align:left;font-family:var(--f-body);padding:8px 10px}
.flab{display:flex;flex-direction:column;gap:4px;font-size:.7rem;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em;min-width:0;flex:1 1 280px}
.dotst{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fg-3)}
.st-g .dotst{background:var(--good)} .st-w .dotst{background:var(--gold-2)} .st-c .dotst{background:var(--crit)}
.hdr .chips{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chartbox{position:relative;height:270px}
.formula{font-family:var(--f-num);font-size:.78rem;background:var(--row);padding:8px 10px;border-radius:7px;overflow-x:auto;white-space:pre}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.fgrid h3{font-size:.92rem;margin-bottom:4px}
.fgrid p{margin:4px 0 0;font-size:.84rem;color:var(--fg-2)}
.empty{padding:28px 16px;text-align:center;color:var(--fg-2)}
@media (max-width:560px){.brand h1{font-size:1.3rem}.sel{min-width:140px}.kpi .v{font-size:1.28rem}.hdr{padding:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</div></div></header>

<script>
/* ==== NÚCLEO: catálogo, lectores y cálculos (sin dependencias de UI) ==== */
const Core = (() => {
  const TIENDAS = ['ACARIGUA','ALTO CHAMA','BARINAS','CABIMAS','EJIDO','GUANARE','LA PEDREGOSA','LAS AMERICAS','PARAMILLO','PIRINEOS','PUEBLO NUEVO','ROTARIA','SAN JOSECITO','SANTA BARBARA'];

  // Grupos según el SubGrupo del ERP (Especialidades, Primera, Segunda, Tercera, Subproductos) + merma
  const CLASES = {
    ESPECIAL: { nombre:'Cortes especiales', orden:1, carne:true,  vendible:true },
    PRIMERA:  { nombre:'Carne de primera',  orden:2, carne:true,  vendible:true },
    SEGUNDA:  { nombre:'Carne de segunda',  orden:3, carne:true,  vendible:true },
    TERCERA:  { nombre:'Cortes de tercera', orden:4, carne:false, vendible:true },
    VISCERA:  { nombre:'Vísceras',          orden:5, carne:false, vendible:true },
    GRASA:    { nombre:'Grasa y sebo',      orden:6, carne:false, vendible:false },
    MERMA:    { nombre:'Merma técnica',     orden:7, carne:false, vendible:false },
  };
  // canal:false = no sale del desposte de canal (comprado ya cortado o viene de trastes)
  const FAMILIAS = [
    { id:'LOMITO',   nombre:'Lomito',              clase:'ESPECIAL', canal:true },
    { id:'SOLOMO',   nombre:'Solomo',              clase:'ESPECIAL', canal:true },
    { id:'PUNTA',    nombre:'Punta trasera',       clase:'ESPECIAL', canal:true },
    { id:'POLLO',    nombre:'Pollo de res',        clase:'ESPECIAL', canal:true },
    { id:'ESP_OTROS',nombre:'Otros especiales',    clase:'ESPECIAL', canal:true },
    { id:'DISPROCAR',nombre:'Cortes Disprocar',    clase:'ESPECIAL', canal:false },
    { id:'PRIMERA',  nombre:'Carne de primera',    clase:'PRIMERA',  canal:true },
    { id:'SEGUNDA',  nombre:'Carne de segunda',    clase:'SEGUNDA',  canal:true },
    { id:'LAGARTO',  nombre:'Lagarto',             clase:'SEGUNDA',  canal:true },
    { id:'ASADO',    nombre:'Asado de tira',       clase:'TERCERA',  canal:true },
    { id:'COSTILLA', nombre:'Costilla',            clase:'TERCERA',  canal:true },
    { id:'OSOBUCO',  nombre:'Osobuco',             clase:'TERCERA',  canal:true },
    { id:'HUESO',    nombre:'Hueso',               clase:'TERCERA',  canal:true },
    { id:'TER_OTROS',nombre:'Otros de tercera',    clase:'TERCERA',  canal:true },
    { id:'VISCERAS', nombre:'Vísceras (trastes)',  clase:'VISCERA',  canal:false },
    { id:'GRASA',    nombre:'Grasa / sebo',        clase:'GRASA',    canal:true },
    { id:'MERMA',    nombre:'Merma técnica',       clase:'MERMA',    canal:true },
  ];
  const PADRES = [
    { re:/NOVILLO.*TIPO AA.*DESPOSTABLE/, id:'NOV_AA', nombre:'Novillo tipo AA despostable', canal:true },
    { re:/NOVILLO.*TIPO A DESPOSTABLE/, id:'NOV_A', nombre:'Novillo tipo A despostable', canal:true },
    { re:/DESPOSTABLE|MEDIA CANAL|CUARTO (ANTERIOR|TRASERO|POSTERIOR|DELANTERO)/, id:'OTRO_PADRE', nombre:'Otra materia prima despostable', canal:true },
    { re:/TRASTES/, id:'TRASTES', nombre:'Trastes completos', canal:false },
  ];
  const REGLAS = [
    [/^MERMA|\bMERMA PK/, 'MERMA'],
    [/DISPROCAR/, 'DISPROCAR'],
    [/HIGADO|PATAS|CALLO|LENGUA|BOFE|COLA RES|CORAZON|RINON|PAJARILLA|PANZA|MONDONGO|CRIADILLA|SESOS/, 'VISCERAS'],
    [/HUESO/, 'HUESO'],
    [/GRASA|SEBO/, 'GRASA'],
    [/OSOBUCO/, 'OSOBUCO'],
    [/LAGARTO/, 'LAGARTO'],
    [/CROQUETA|HAMBURG|MOLIDA|GUISAR|SEGUNDA/, 'SEGUNDA'],
    [/LOMITO/, 'LOMITO'],
    [/SOLOMO/, 'SOLOMO'],
    [/PUNTA/, 'PUNTA'],
    [/POLLO DE RES/, 'POLLO'],
    [/ASADO.*TIRA/, 'ASADO'],
    [/COSTILLA/, 'COSTILLA'],
    [/LOMO D.?AGUJA/, 'ESP_OTROS'],
    [/PRIMERA|BISTEC|PULPA|PULPON|MUCHACHO|GANSO|MECHAR|AGUJA|MEDALLON|PINCHO|CHOCOZUELA|PALOMA|FALDA/, 'PRIMERA'],
  ];
  const SUBGRUPO = { 'ESPECIALIDADES CARNE':'ESP_OTROS', 'PRIMERA':'PRIMERA', 'SEGUNDA':'SEGUNDA', 'TERCERA':'TER_OTROS', 'SUBPRODUCTOS RES':'VISCERAS' };

  // Motivos de ajuste de Kardex → MERMA | CONSUMO (operativo, no es merma) | TRANSFORMACION (no es merma) | OTRO
  const MOTIVO_CLASES = {
    MERMA:          { nombre:'Merma', merma:true },
    CONSUMO:        { nombre:'Consumo operativo', merma:false },
    TRANSFORMACION: { nombre:'Transformación / reclasificación', merma:false },
    OTRO:           { nombre:'Sin clasificar', merma:false },
  };
  function motivoClase(m, ov) {
    const n = norm(m); if (ov && ov[n]) return ov[n];
    if (/TRANSFORMA|PRODUCCION|CRUCE|RECLASIF|CAMBIO DE COD/.test(n)) return 'TRANSFORMACION';
    if (/DONACION|APOYO|COMIDA|PERSONAL|PROMO|MERCADEO|DEGUSTA|MUESTRA|CONSUMO INTERNO/.test(n)) return 'CONSUMO';
    if (/AVERIA|MERMA|PERDIDA|VENCI|DETERIOR|ROBO|HURTO|DESCOMP|DANO|ROTURA|CADUC/.test(n)) return 'MERMA';
    return 'OTRO';
  }

  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
  const num = s => { if (typeof s === 'number') return s; const t = String(s ?? '').replace(/,/g,'').trim(); const v = parseFloat(t); return isNaN(v) ? 0 : v; };
  const esNum = s => /^-?[\d,]*\.?\d+$/.test(String(s).trim());
  const fam = id => FAMILIAS.find(f => f.id === id);
  const famClase = id => (fam(id) || {}).clase;
  const famCanal = id => !!(fam(id) || {}).canal;

  function padreDe(nombre) { const n = norm(nombre); for (const p of PADRES) if (p.re.test(n)) return p; return null; }
  function familiaPorRegla(nombre, subgrupo) {
    const n = norm(nombre); if (padreDe(n)) return null;
    for (const [re, f] of REGLAS) if (re.test(n)) return f;
    return subgrupo ? (SUBGRUPO[norm(subgrupo)] || null) : null;
  }
  function kgPorUnidad(nombre) { const n = norm(nombre); let m = n.match(/(\d+(?:\.\d+)?)\s*KG\b/); if (m) return +m[1]; m = n.match(/(\d+)\s*G(R|RS)?\b/); if (m) return +m[1]/1000; return 0; }
  const isoDMY = s => { const m = String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; };

  /* ---------- PDF "Reporte de Producción" ---------- items: [{p,x,y,w,s}] de pdf.js */
  function parseDesposte(items, fuente) {
    const it = items.filter(i => String(i.s).trim()).map(i => ({ ...i, s: String(i.s).trim(), cx: i.x + i.w/2, Y: -i.p*2000 + i.y }));
    it.sort((a,b) => b.Y - a.Y || a.x - b.x);
    const lineas = [];
    for (const i of it) { const L = lineas.find(l => Math.abs(l.Y - i.Y) < 2.5); if (L) L.items.push(i); else lineas.push({ Y:i.Y, items:[i] }); }
    lineas.forEach(l => { l.items.sort((a,b)=>a.x-b.x); l.txt = l.items.map(i=>i.s).join(' '); });
    lineas.sort((a,b)=>b.Y-a.Y);
    const docs = []; let cur = null, seccion = null, cols = null, hdrVals = [];
    const nuevo = () => ({ tienda:'', nombre:'', merma:0, fecha:'', subtotal:0, padres:[], hijos:[], avisos:[], fuente });
    const nearest = (i, cs) => { let best=null, d=1e9; for (const c of cs) { const dd = Math.abs(c.cx - i.cx); if (dd < d) { d = dd; best = c; } } return best; };
    for (const L of lineas) {
      const t = norm(L.txt);
      if (/^ORGANIZACION\b/.test(t) && /TIENDA/.test(t)) { if (cur) docs.push(cur); cur = nuevo(); seccion = 'HDR'; cols = L.items.map(i => ({ k: norm(i.s), cx: i.cx })); hdrVals = []; continue; }
      if (!cur) continue;
      if (/^PRODUCTOS A UTILIZAR/.test(t)) { seccion = 'MU'; cols = null; continue; }
      if (/^PRODUCTOS TERMINADOS/.test(t)) { seccion = 'MP'; cols = null; continue; }
      if (/^TOTAL:|^PAG \d|COPYRIGHT|^GRUPO:|^RIF:|^FECHA:|REPORTE DE PRODUCCION/.test(t)) continue;
      if (seccion === 'HDR') {
        for (const i of L.items) { const c = nearest(i, cols); hdrVals.push({ k:c.k, s:i.s }); }
        const get = k => hdrVals.filter(v => v.k.startsWith(k)).map(v => v.s);
        cur.tienda = norm(get('TIENDA').join(' '));
        cur.nombre = get('NOMBRE').join(' ').replace(/\s+/g,' ').trim();
        cur.merma = num(get('MERMA')[0]);
        cur.fecha = isoDMY(get('FECHA')[0]);
        cur.subtotal = num(get('SUBTOTAL')[0]);
        continue;
      }
      if ((seccion === 'MU' || seccion === 'MP') && !cols && /ARTICULO/.test(t)) { cols = L.items.map(i => ({ k: norm(i.s), cx: i.cx })); continue; }
      if ((seccion === 'MU' || seccion === 'MP') && cols) {
        const numCols = cols.filter(c => !/^(TIPO|ARTICULO)$/.test(c.k));
        const row = {}; const txt = [];
        L.items.forEach((i, idx) => {
          if (esNum(i.s) && !(seccion==='MP' && idx===0)) { const c = nearest(i, numCols); row[c.k] = i.s; }
          else if (idx <= 1 && /^[A-Z]{2,3}$/.test(i.s) && !row.TIPO) row.TIPO = i.s;
          else txt.push(i.s);
        });
        if (!txt.length) continue;
        if (seccion === 'MU') cur.padres.push({ doc: row['NUMERO DOC.'] || '', tipo: row.TIPO || '', art: txt.join(' '), kg: num(row.CANTIDAD), costo: num(row.COSTOS), sub: num(row['SUB TOTAL']) });
        else cur.hijos.push({ tipo: row.TIPO || '', art: txt.join(' '), costo: num(row.COSTOS), kg: num(row.CANTIDAD), total: num(row.TOTAL), precio: num(row.PRECIO), margen: num(row.MARGEN) });
      }
    }
    if (cur) docs.push(cur);
    docs.forEach(validarDesposte);
    return docs;
  }
  function validarDesposte(d) {
    d.avisos = [];
    if (!TIENDAS.includes(d.tienda)) d.avisos.push(`Tienda "${d.tienda}" no reconocida`);
    if (!d.fecha) d.avisos.push('Sin fecha de producción');
    if (!d.padres.length) d.avisos.push('Sin productos a utilizar (padre)');
    if (!d.hijos.length) d.avisos.push('Sin productos terminados');
    const kgP = d.padres.reduce((s,p)=>s+p.kg,0), kgH = d.hijos.reduce((s,h)=>s+h.kg,0);
    if (Math.abs(kgP - kgH) > 0.05) d.avisos.push(`Cuadre de kilos: padre ${kgP.toFixed(3)} vs hijos+merma ${kgH.toFixed(3)}`);
    d.hijos.forEach(h => { h.fam = familiaPorRegla(h.art); if (!h.fam) d.avisos.push(`Corte sin familia: ${h.art}`); });
    d.padres.forEach(p => { const pp = padreDe(p.art); p.padre = pp ? pp.id : 'SIN_MAPEO'; });
    d.id = `${d.tienda}|${d.padres.map(p=>p.doc).join('+')}|${d.fecha}`;
    return d;
  }

  /* ---------- Excel: detecta VentasxDpto o Ajustes de Kardex ---------- */
  function headerRow(aoa, must) { for (let r = 0; r < Math.min(aoa.length, 30); r++) { const row = (aoa[r]||[]).map(norm); if (must.every(m => row.some(c => c === m || c.startsWith(m)))) return r; } return -1; }
  function tipoExcel(aoa) {
    if (headerRow(aoa, ['MOTIVO','TIENDA','CANT.']) >= 0) return 'AJUSTES';
    if (headerRow(aoa, ['TIENDA','CODIGO','CANT. VENTA']) >= 0) return 'VENTAS';
    return null;
  }
  const fechaCel = f => {
    if (f instanceof Date) return `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}-${String(f.getDate()).padStart(2,'0')}`;
    if (typeof f === 'number') return new Date(Math.round((f - 25569) * 864e5)).toISOString().slice(0,10);
    return isoDMY(f) || String(f).slice(0,10);
  };
  function parseVentas(aoa) {
    const h = headerRow(aoa, ['TIENDA','CODIGO','CANT. VENTA']);
    if (h < 0) throw new Error('No encontré la fila de encabezados (Tienda, Codigo, Cant. Venta…). ¿Es el reporte VentasxDpto?');
    const H = aoa[h].map(norm); const ix = k => H.indexOf(k);
    const C = { t:ix('TIENDA'), d:ix('DEPARTAMENTO'), g:ix('GRUPO'), c:ix('CODIGO'), a:ix('ARTICULO'), u:ix('TIPO ARTICULO'), f:ix('FECHA'), kv:ix('CANT. VENTA'), cv:ix('COSTO VENTA'), sv:ix('SUBTOTAL VENTA'), kc:ix('CANT. COMPRA'), sc:ix('SUBTOTAL COMPRA'), pd:ix('PROMO DSCTO.') };
    const faltan = Object.entries(C).filter(([k,v]) => v < 0 && !['pd','d','u'].includes(k)).map(([k])=>k);
    if (faltan.length) throw new Error('Faltan columnas: ' + faltan.join(', '));
    const out = [];
    for (let r = h+1; r < aoa.length; r++) {
      const R = aoa[r]; if (!R || R[C.c] == null || R[C.t] == null || R[C.f] == null) continue;
      out.push({ t:norm(R[C.t]), dp:norm(R[C.d]), g:norm(R[C.g]), c:String(R[C.c]), a:String(R[C.a]).trim(), u:norm(R[C.u]), f:fechaCel(R[C.f]),
        kv:num(R[C.kv]), cv:num(R[C.cv]), sv:num(R[C.sv]), kc:num(R[C.kc]), sc:num(R[C.sc]), pd: C.pd>=0 ? num(R[C.pd]) : 0 });
    }
    return out;
  }
  function parseAjustes(aoa) {
    const h = headerRow(aoa, ['MOTIVO','TIENDA','CANT.']);
    if (h < 0) throw new Error('No encontré la fila de encabezados (Motivo, Tienda, Cant.…). ¿Es el reporte Ajustes de Kardex?');
    let desde = '', hasta = '';
    for (let r = 0; r < h; r++) { const s = (aoa[r]||[]).join(' '); const m = s.match(/Desde:\s*(\d{2}\/\d{2}\/\d{4}).*Hasta:\s*(\d{2}\/\d{2}\/\d{4})/i); if (m) { desde = isoDMY(m[1]); hasta = isoDMY(m[2]); } }
    if (!hasta) throw new Error('No encontré el rango de fechas ("Desde: … Hasta: …") en el encabezado del reporte');
    const H = aoa[h].map(norm); const ix = k => H.indexOf(k);
    const C = { mot:ix('MOTIVO'), tm:ix('TIPO MOTIVO'), tipo:ix('TIPO'), t:ix('TIENDA'), c:ix('CODIGO'), a:ix('ARTICULO'), kg:ix('CANT.'), g:ix('GRUPO'), sub:ix('SUBGRUPO'), dp:ix('DEPARTAMENTO'), usd:ix('TOTAL') };
    const faltan = Object.entries(C).filter(([k,v]) => v < 0 && ['mot','t','c','a','kg','usd'].includes(k)).map(([k])=>k);
    if (faltan.length) throw new Error('Faltan columnas: ' + faltan.join(', '));
    const out = [];
    for (let r = h+1; r < aoa.length; r++) {
      const R = aoa[r]; if (!R || R[C.c] == null || R[C.t] == null || R[C.mot] == null) continue;
      out.push({ t:norm(R[C.t]), c:String(R[C.c]), a:String(R[C.a]).trim(), mot:String(R[C.mot]).trim(), tipo:norm(R[C.tipo]), dp:norm(R[C.dp]), g:norm(R[C.g]), sub:norm(R[C.sub]),
        kg:num(R[C.kg]), usd:num(R[C.usd]), desde, hasta });
    }
    return out;
  }

  /* ---------- Catálogo efectivo (reglas + correcciones manuales) ---------- */
  function clasificarArticulo(a, overrides) {
    const o = overrides && overrides[a.c];
    const p = padreDe(a.a);
    if (o === 'EXCLUIR') return { rol:'EXCLUIDO', fam:null, origen:'manual' };
    if (o) return { rol: o === 'PADRE' ? 'PADRE' : 'HIJO', fam: o === 'PADRE' ? null : o, origen:'manual', padre: o === 'PADRE' ? (p ? p.id : 'OTRO_PADRE') : null };
    if (p) return { rol:'PADRE', fam:null, padre:p.id, canal:p.canal, origen:'regla' };
    const f = familiaPorRegla(a.a, a.sub);
    return { rol: f ? 'HIJO' : 'SIN_MAPEO', fam: f, origen: f ? 'regla' : 'pendiente' };
  }
  const factorKg = r => r.u === 'UNIDAD' ? kgPorUnidad(r.a) : 1;
  const sum = (a, f) => a.reduce((s, x) => s + (f(x) || 0), 0);

  /* ---------- KPIs de un acta ---------- */
  function kpiDesposte(d, preciosReal) {
    const kgPadre = sum(d.padres, p => p.kg), costoPadre = sum(d.padres, p => p.sub);
    const hijos = d.hijos.map(h => ({ ...h, clase: famClase(h.fam) || 'SIN' }));
    const noVend = h => h.clase === 'MERMA' || h.clase === 'GRASA' || !(h.precio > 0);
    const kgMerma = sum(hijos.filter(noVend), h => h.kg);
    const vend = hijos.filter(h => !noVend(h));
    const kgVend = sum(vend, h => h.kg);
    const kgCarne = sum(vend.filter(h => CLASES[h.clase]?.carne), h => h.kg);
    const valorLista = sum(vend, h => h.kg * h.precio);
    let valorReal = 0; const famsSinVenta = [];
    vend.forEach(h => { const pr = preciosReal && preciosReal[h.fam]; if (pr) valorReal += h.kg * pr; else { valorReal += h.kg * h.precio; famsSinVenta.push(h.fam); } });
    const f = valorLista > 0 ? costoPadre / valorLista : 0;
    const cortes = hijos.map(h => ({ ...h, vendible: !noVend(h), rend: kgPadre ? h.kg / kgPadre : 0, costoVRV: noVend(h) ? 0 : h.precio * f, precioReal: preciosReal && preciosReal[h.fam] || null }));
    return { kgPadre, costoPadre, costoKgPadre: kgPadre ? costoPadre / kgPadre : 0, kgVend, kgMerma, kgCarne, kgDif: kgPadre - sum(hijos, h=>h.kg),
      rendVend: kgPadre ? kgVend / kgPadre : 0, rendCarne: kgPadre ? kgCarne / kgPadre : 0, pctMerma: kgPadre ? kgMerma / kgPadre : 0,
      costoKgUtil: kgVend ? costoPadre / kgVend : 0, valorLista, margenLista: valorLista ? 1 - f : 0,
      valorReal, margenReal: valorReal ? 1 - costoPadre / valorReal : 0, famsSinVenta, costoERP: sum(hijos, h => h.total), factorVRV: f, cortes };
  }

  /* ---------- Ventas/compras ---------- */
  function aggVentas(rows, overrides) {
    const porFam = {}, porArt = {}, porDia = {};
    const padres = { kg:0, sc:0 }, trastes = { kg:0, sc:0 }, sinMapeo = new Set();
    const tot = { sv:0, cv:0, kv:0, pd:0, sc:0, kvCanal:0 };
    for (const r of rows) {
      const k = clasificarArticulo(r, overrides);
      if (k.rol === 'EXCLUIDO') continue;
      tot.sv += r.sv; tot.cv += r.cv; tot.pd += r.pd; tot.sc += r.sc;
      if (k.rol === 'PADRE') { const b = k.padre === 'TRASTES' ? trastes : padres; b.kg += r.kc; b.sc += r.sc; }
      if (k.rol === 'SIN_MAPEO') sinMapeo.add(r.c + ' · ' + r.a);
      const kg = r.kv * factorKg(r);
      if (k.rol === 'HIJO') {
        tot.kv += kg; if (famCanal(k.fam)) tot.kvCanal += kg;
        const F = porFam[k.fam] ||= { fam:k.fam, kv:0, sv:0, cv:0 }; F.kv += kg; F.sv += r.sv; F.cv += r.cv;
      }
      const A = porArt[r.c] ||= { c:r.c, a:r.a, fam:k.fam, rol:k.rol, origen:k.origen, kv:0, sv:0, cv:0, kc:0, sc:0 };
      A.kv += kg; A.sv += r.sv; A.cv += r.cv; A.kc += r.kc; A.sc += r.sc;
      const D = porDia[r.f] ||= { f:r.f, sv:0, cv:0, kv:0 }; D.sv += r.sv; D.cv += r.cv; if (k.rol==='HIJO') D.kv += kg;
    }
    Object.values(porFam).forEach(F => { F.precio = F.kv ? F.sv / F.kv : 0; F.margen = F.sv ? 1 - F.cv / F.sv : 0; });
    return { tot, porFam, porArt, porDia, padres, trastes, sinMapeo:[...sinMapeo] };
  }

  /* ---------- Ajustes de Kardex ----------
     Merma operativa de la canal (K) = −Σ kg netos de motivos de MERMA en familias que salen del desposte (canal:true).
     Vísceras y cortes comprados (Disprocar) se reportan aparte. */
  function aggAjustes(rows, ovArt, ovMot) {
    const porMot = {}, porFam = {};
    const r0 = () => ({ kg:0, usd:0, ent:0, sal:0, n:0 });
    const canal = { MERMA:r0(), CONSUMO:r0(), TRANSFORMACION:r0(), OTRO:r0() }, otros = { MERMA:r0(), CONSUMO:r0(), TRANSFORMACION:r0(), OTRO:r0() };
    for (const r of rows) {
      const cl = motivoClase(r.mot, ovMot);
      const k = clasificarArticulo(r, ovArt); if (k.rol === 'EXCLUIDO') continue;
      const esCanal = k.rol === 'HIJO' && famCanal(k.fam);
      const B = (esCanal ? canal : otros)[cl];
      B.kg += r.kg; B.usd += r.usd; B.n++; if (r.kg >= 0) B.ent += r.kg; else B.sal += r.kg;
      const M = porMot[r.mot] ||= { mot:r.mot, cl, kg:0, usd:0, ent:0, sal:0, n:0, kgCanal:0 };
      M.kg += r.kg; M.usd += r.usd; M.n++; if (r.kg >= 0) M.ent += r.kg; else M.sal += r.kg; if (esCanal) M.kgCanal += r.kg;
      if (k.fam) { const F = porFam[k.fam] ||= { fam:k.fam, merma:0, transf:0, consumo:0 }; if (cl === 'MERMA') F.merma += r.kg; else if (cl === 'TRANSFORMACION') F.transf += r.kg; else if (cl === 'CONSUMO') F.consumo += r.kg; }
    }
    return { canal, otros, porMot, porFam,
      K: -canal.MERMA.kg, Kusd: -canal.MERMA.usd, consumo: -canal.CONSUMO.kg, transf: canal.TRANSFORMACION.kg,
      Kvisc: -otros.MERMA.kg, Kotros: -otros.MERMA.usd };
  }

  /* Merma total y rendimiento neto
     t = merma técnica del acta (kg no vendibles / kg canal)
     o = merma operativa = K / (kg vendidos de canal + K)   → parte del producto disponible que se perdió después del desposte
     Rend. neto = (1 − t) × (1 − o);  Merma total = 1 − Rend. neto = t + (1 − t) × o */
  function mermaTotal(t, K, kgVendCanal) {
    const o = kgVendCanal > 0 ? Math.max(0, K) / (kgVendCanal + Math.max(0, K)) : null;
    if (t == null) return { t:null, o, neto:null, total:null };
    const neto = (1 - t) * (1 - (o ?? 0));
    return { t, o, neto, total: 1 - neto, parcial: o == null };
  }

  return { TIENDAS, FAMILIAS, CLASES, PADRES, MOTIVO_CLASES, norm, num, padreDe, familiaPorRegla, kgPorUnidad, motivoClase, tipoExcel,
    parseDesposte, validarDesposte, parseVentas, parseAjustes, clasificarArticulo, factorKg, kpiDesposte, aggVentas, aggAjustes, mermaTotal, famClase, famCanal, sum };
})();

      const hint = (r.status === 404 || /PGRST20[25]|42P01|does not exist|Could not find/.test(code + ' ' + m)) ? ' Corre primero supabase_tablero_res.sql en el SQL Editor del proyecto.' : (r.status === 401 || r.status === 403) ? ' Revisa que la clave sea la publicable (anon) de ese proyecto.' : '';

function limpiaUrl(u){ return String(u).trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,''); }
const toV = r => ({ tienda:r.t, codigo:r.c, fecha:r.f, departamento:r.dp||null, grupo:r.g||null, articulo:r.a, tipo_articulo:r.u||null, kg_venta:r.kv||0, costo_venta:r.cv||0, venta:r.sv||0, kg_compra:r.kc||0, compra:r.sc||0, promo:r.pd||0 });

const fromA = x => ({ t:x.tienda, c:String(x.codigo), a:x.articulo||'', mot:x.motivo, tipo:x.tipo||'', dp:x.departamento||'', g:x.grupo||'', sub:x.subgrupo||'', kg:+x.kg, usd:+x.usd, desde:x.desde, hasta:x.hasta });

const toD = d => ({ id:d.id, tienda:d.tienda, fecha:d.fecha, nombre:d.nombre, merma_kg:d.merma, subtotal:d.subtotal, fuente:d.fuente||null, padres:d.padres, hijos:d.hijos.map(({ fam, ...h }) => h), anulado:false });
const fromD = x => Core.validarDesposte({ tienda:x.tienda, fecha:x.fecha, nombre:x.nombre||'', merma:+x.merma_kg, subtotal:+x.subtotal, fuente:x.fuente||'', padres:x.padres||[], hijos:x.hijos||[] });
async function ejecutar(op){
  switch (op.k) {
    case 'desp':   return Cloud.upsert('res_despostes', op.rows.map(toD), 'id');
    case 'ven':    return Cloud.upsert('res_ventas', op.rows.map(toV), 'tienda,codigo,fecha');
    case 'aj':     return Cloud.req('rpc/res_reemplazar_ajustes', { method:'POST', body:{ p_desde:op.desde, p_hasta:op.hasta, p_archivo:op.archivo||null, p_filas:op.filas } });
    case 'anular': return Cloud.req(`res_despostes?id=eq.${encodeURIComponent(op.id)}`, { method:'PATCH', body:{ anulado:true }, prefer:'return=minimal' });
    case 'cfg':    return Cloud.upsert('res_config', [{ clave:'ov', valor:S.ov }, { clave:'ovMot', valor:S.ovMot }, { clave:'est', valor:S.est }], 'clave');

// Escribe en la nube; si falla, queda en cola (guardada en este navegador) y se reintenta al recargar
async function nube(op){
  if (!Cloud.cfg) return null;
  try { await ejecutar(op); if (!Cloud.pend.length) { Cloud.estado = 'ok'; Cloud.error = ''; Cloud.sync = new Date(); } return true; }
  catch(e) { if (op.k === 'log') return false;   // la bitácora no es crítica: no se encola
    if (!(op.k === 'cfg' && Cloud.pend.some(p => p.k === 'cfg'))) Cloud.pend.push(op); Cloud.estado = 'pendiente'; Cloud.error = e.message; await DB.set('pend', Cloud.pend); return false; }
}
async function syncPend(){ const q = Cloud.pend.slice(); Cloud.pend = []; for (const op of q) { try { await ejecutar(op); } catch(e) { Cloud.pend.push(op); Cloud.error = e.message; } } await DB.set('pend', Cloud.pend); return !Cloud.pend.length; }
async function cargarNube(){
  Cloud.estado = 'conectando'; pintarEstado();
  try {
    if (Cloud.pend.length && !(await syncPend())) { Cloud.estado = 'pendiente'; return false; }   // no pisar datos locales que aún no subieron
    const [d, v, a, c] = await Promise.all([ Cloud.all('res_despostes', '&anulado=eq.false', 'id'), Cloud.all('res_ventas', '', 'tienda,codigo,fecha'), Cloud.all('res_ajustes', '&vigente=eq.true', 'id'), Cloud.all('res_config', '', 'clave') ]);
    S.despostes = d.map(fromD); S.ventas = v.map(fromV); S.ajustes = a.map(fromA);
    const cf = Object.fromEntries(c.map(x => [x.clave, x.valor])); S.ov = cf.ov || {}; S.ovMot = cf.ovMot || {}; S.est = cf.est || {};
    Cloud.estado = 'ok'; Cloud.error = ''; Cloud.sync = new Date(); dirty(); await save(); return true;
  } catch(e) { Cloud.estado = 'error'; Cloud.error = e.message; return false; }
}
async function subirTodo(){

  const grupos = {}; S.ajustes.forEach(r => (grupos[r.desde + '|' + r.hasta] ||= []).push(r));
  for (const [k, rows] of Object.entries(grupos)) { const [desde, hasta] = k.split('|'); await ejecutar({ k:'aj', desde, hasta, archivo:'Subida desde el navegador', filas:rows.map(filaAj) }); }
  await ejecutar({ k:'cfg' });
}

/* ---------- Derivados ---------- */
const famDesp = h => S.ov['D:'+norm(h.art)] || Core.familiaPorRegla(h.art);
const mesDe = f => (f||'').slice(0,7);
const inM = (f, mes) => mes === '*' || mesDe(f) === mes;
const inT = (t, tienda) => tienda === '*' || t === tienda;
const precioCache = new Map();
function preciosReal(tienda, mes){
  const k = tienda+'|'+mes; if (precioCache.has(k)) return precioCache.get(k);
  const a = Core.aggVentas(S.ventas.filter(r => r.t === tienda && mesDe(r.f) === mes), S.ov);
  const p = {}; Object.values(a.porFam).forEach(F => { if (F.kv > 0) p[F.fam] = F.precio; });
  precioCache.set(k, p); return p;
}
function kpiD(d){ const dd = { ...d, hijos: d.hijos.map(h => ({ ...h, fam: famDesp(h) })) }; return Core.kpiDesposte(dd, preciosReal(d.tienda, mesDe(d.fecha))); }
const padreD = d => (d.padres[0]||{}).padre || 'SIN_MAPEO';

// Agregado de actas: rendimiento, merma técnica y utilidad por grupo/familia a la base de precio elegida
function aggD(list, base = S.base){
  const o = { n:list.length, kgP:0, kgV:0, kgM:0, kgC:0, cP:0, vR:0, vL:0, venta:0, costo:0, cls:{}, fams:{} };
  list.forEach(d => { const k = kpiD(d);
    o.kgP += k.kgPadre; o.kgV += k.kgVend; o.kgM += k.kgMerma; o.kgC += k.kgCarne; o.cP += k.costoPadre; o.vR += k.valorReal; o.vL += k.valorLista;
    k.cortes.forEach(c => { const pr = c.vendible ? (base === 'real' ? (c.precioReal || c.precio) : c.precio) : 0; const v = c.kg * pr, co = c.kg * c.costoVRV;
      const cl = c.clase || 'SIN'; const C = o.cls[cl] ||= { kg:0, venta:0, costo:0 }; C.kg += c.kg; C.venta += v; C.costo += co;
      const F = o.fams[c.fam||'SIN'] ||= { fam:c.fam, clase:cl, kg:0, venta:0, costo:0 }; F.kg += c.kg; F.venta += v; F.costo += co;
      o.venta += v; o.costo += co; }); });
  Object.assign(o, { rend: o.kgP ? o.kgV/o.kgP : null, rendC: o.kgP ? o.kgC/o.kgP : null, merma: o.kgP ? o.kgM/o.kgP : null,
    mgReal: o.vR ? 1-o.cP/o.vR : null, mgLista: o.vL ? 1-o.cP/o.vL : null, cKgP: o.kgP ? o.cP/o.kgP : null, cKgU: o.kgV ? o.cP/o.kgV : null,
    util: o.venta - o.costo, mg: o.venta ? 1 - o.costo/o.venta : null });
  return o;
}
let REFc = null; const REF = () => REFc ||= aggD(S.despostes);   // referencia = todas las actas cargadas
// Métricas completas para una tienda ('*' = cadena) y un mes ('*' = todo)
function metricas(tienda, mes, actasList){
  const actas = actasList || S.despostes.filter(d => inT(d.tienda, tienda) && inM(d.fecha, mes));
  const D = aggD(actas);
  const ven = S.ventas.filter(r => inT(r.t, tienda) && inM(r.f, mes)); const av = Core.aggVentas(ven, S.ov);
  const aj = Core.aggAjustes(S.ajustes.filter(r => inT(r.t, tienda) && inM(r.hasta, mes)), S.ov, S.ovMot);
  const tV = new Set(ven.map(r=>r.t));   // la merma operativa solo se mide donde hay ventas cargadas
  const ajV = Core.aggAjustes(S.ajustes.filter(r => tV.has(r.t) && inM(r.hasta, mes)), S.ov, S.ovMot);
  const tRef = D.merma == null; const t = tRef ? REF().merma : D.merma;
  const mt = Core.mermaTotal(t, ajV.K, av.tot.kvCanal);
  return { actas, D, av, aj, ajV, mt, tRef, tV };
}
function estandar(padre){
  const man = S.est[padre] || {}; const hist = {}; const lst = S.despostes.filter(d => padreD(d) === padre);
  const kgP = sum(lst, d => sum(d.padres, p=>p.kg));
  lst.forEach(d => d.hijos.forEach(h => { const f = famDesp(h); hist[f] = (hist[f]||0) + h.kg; }));
  const out = {}; Object.keys(hist).forEach(f => out[f] = { pct: hist[f]/kgP, src:'hist' });
  Object.keys(man).forEach(f => { if (man[f] != null && man[f] !== '') out[f] = { pct: +man[f]/100, src:'manual' }; });
  return { fams:out, n:lst.length };
}

    ${kpi('Rendimiento neto', fPct(mt.o==null?null:mt.neto), mt.o==null?'sin VentasxDpto para medir Kardex':`tras <span class="num">${fKg(M.ajV.K,1)}</span> de merma Kardex`, '', 'good')}
    ${kpi('Merma total', fPct(mt.o==null?null:mt.total), `técnica <span class="num">${fKg(D.kgM)}</span> · <span class="num">${fUSD(D.kgM*(costoKgCanal||0))}</span> a costo canal`, '', 'bad')}
    ${kpi('Costo por kg vendible', fUSD(D.cKgU||0,2), `vs <span class="num">${fUSD(costoKgCanal||0,2)}</span> del canal${mt.o!=null?` · neto <span class="num">${fUSD(D.cKgU/(1-mt.o),2)}</span>`:''}`)}
  </div>
  <section class="sec"><div class="sec-h"><h2>Del canal a la caja</h2><p>${ref?'Todas las actas y todos los ajustes cargados':esc(titulo(S.canal))+' · '+fMes(S.mes)}</p></div><div class="glass pad">${cascada(mt, D.kgP)}</div></section>

function bindCanal(){

/* ---------- Promedio mensual ---------- */

  const filas = meses.map(m => ({ m, M: metricas(S.tienda, m) }));
  let h = `<section class="sec"><div class="sec-h"><h2>Promedio mensual · ${S.tienda==='*'?'consolidado cadena':esc(titulo(S.tienda))}</h2><p>Ponderado por kg de canal despostada</p></div>
  <div class="glass tw"><table><thead><tr><th>Mes</th><th class="n">Actas</th><th class="n">Kg despostados</th><th class="n">Rend. acta</th><th class="n">Rend. carne</th><th class="n">Merma técnica</th><th class="n">Merma Kardex kg</th><th class="n">Merma operativa</th><th class="n">Merma total</th><th class="n">Rend. neto</th><th class="n">$/kg canal</th><th class="n">$/kg útil</th><th class="n">Margen bruto</th></tr></thead><tbody>
  ${filas.map(({m,M}) => `<tr><td>${fMes(m)}</td><td class="n">${M.D.n||'—'}</td><td class="n">${M.D.n?nf1.format(M.D.kgP):'—'}</td><td class="n">${fPct(M.D.rend)}</td><td class="n">${fPct(M.D.rendC)}</td><td class="n">${fPct(M.D.merma)}</td><td class="n">${nf1.format(M.aj.K)}</td><td class="n">${fPct(M.mt.o)}</td><td class="n">${M.mt.o==null?'—':fPct(M.mt.total)}</td><td class="n">${M.mt.o==null?'—':fPct(M.mt.neto)}</td><td class="n">${M.D.cKgP?nf2.format(M.D.cKgP):'—'}</td><td class="n">${M.D.cKgU?nf2.format(M.D.cKgU):'—'}</td><td class="n">${fPct(M.av.tot.sv?1-M.av.tot.cv/M.av.tot.sv:null)}</td></tr>`).join('')}
  </tbody></table></div></section>`;
  const tiendas = [...new Set(S.despostes.filter(d=>inT(d.tienda,S.tienda)).map(d=>d.tienda))].sort();
  h += `<section class="sec"><div class="sec-h"><h2>Evolución del rendimiento del acta</h2><p>Por tienda y mes</p></div><div class="glass pad">${meses.length < 2 ? `<div class="empty">La serie se dibuja desde dos meses con actas. Hoy hay datos de ${meses.map(fMes).join(', ')||'ningún mes'}.</div>` : `<div class="chartbox"><canvas id="cMes"></canvas></div>`}</div></section>`;
  $('#view').innerHTML = h;
  if (meses.length >= 2) {
    const pal = ['--s1','--s2','--s3','--s4','--s5']; const o = baseOpts(); o.scales.y.ticks.callback = v => v + '%';
    chart('cMes', { type:'line', data:{ labels: meses.map(fMes), datasets: tiendas.slice(0,5).map((t,i) => ({ label: titulo(t), data: meses.map(m => { const D = aggD(S.despostes.filter(d => d.tienda===t && mesDe(d.fecha)===m)); return D.rend==null?null:+(D.rend*100).toFixed(2); }), borderColor:cssv(pal[i]), backgroundColor:cssv(pal[i]), borderWidth:2, pointRadius:4, spanGaps:true })) }, options:o });
  }
}

/* ---------- Merma Kardex ---------- */
function vKardex(){
  const rows = S.ajustes.filter(r => inT(r.t,S.tienda) && inM(r.hasta,S.mes)); const A = Core.aggAjustes(rows, S.ov, S.ovMot);
  if (!rows.length) { $('#view').innerHTML = `<div class="glass empty"><h2>No hay ajustes de Kardex para este filtro</h2><p>Carga el Excel "Ajustes de Kardex" en Cargar archivos.</p></div>`; return; }
  const rango = [...new Set(rows.map(r=>fFecha(r.desde)+' al '+fFecha(r.hasta)))].join(' · ');
  const mot = Object.values(A.porMot).sort((a,b)=>a.kg-b.kg);
  const pillMot = cl => `<span class="pill ${cl==='MERMA'?'c':cl==='OTRO'?'w':'n'}">${MOTIVO_CLASES[cl].nombre}</span>`;
  let h = `<section class="sec"><div class="sec-h"><h2>Ajustes de Kardex · ${S.tienda==='*'?'cadena':esc(titulo(S.tienda))}</h2><p>${esc(rango)} · ${nf0.format(rows.length)} movimientos</p></div>
  <div class="kpis">
    ${kpi('Merma de canal', fKg(A.K,1), `<span class="num">${fUSD(A.Kusd,2)}</span> · entra en la merma total`, 'hl')}
    ${kpi('Merma vísceras y comprados', fKg(A.Kvisc,1), `<span class="num">${fUSD(A.Kotros,2)}</span> · trastes y Disprocar`)}
    ${kpi('Consumo operativo', fKg(A.consumo,1), 'donación, comida al personal y promo; no es merma')}
    ${kpi('Transformación neta', fKg(A.transf,1), 'kg que salen de la categoría al transformar; no es merma')}
  </div></section>
  <section class="sec"><div class="sec-h"><h2>Por motivo</h2><p>El tratamiento se cambia en Catálogo y fórmulas</p></div><div class="glass tw"><table><thead><tr><th>Motivo</th><th>Tratamiento</th><th class="n">Mov.</th><th class="n">Entradas kg</th><th class="n">Salidas kg</th><th class="n">Neto kg</th><th class="n">Neto canal kg</th><th class="n">Neto $</th></tr></thead><tbody>
  ${mot.map(m => `<tr><td>${esc(m.mot)}</td><td>${pillMot(m.cl)}</td><td class="n">${m.n}</td><td class="n">${nf2.format(m.ent)}</td><td class="n">${nf2.format(m.sal)}</td><td class="n">${nf2.format(m.kg)}</td><td class="n">${nf2.format(m.kgCanal)}</td><td class="n">${nf2.format(m.usd)}</td></tr>`).join('')}
  </tbody></table></div></section>`;
  const ts = TIENDAS.filter(t => S.ajustes.some(r => r.t===t && inT(t,S.tienda) && inM(r.hasta,S.mes)));
  h += `<div class="grid2"><section class="sec"><div class="sec-h"><h2>Por tienda</h2><p>Merma de canal y su peso sobre lo vendido</p></div><div class="glass tw"><table><thead><tr><th>Tienda</th><th class="n">Merma kg</th><th class="n">Merma $</th><th class="n">Merma operativa</th><th class="n">Transf. neta kg</th></tr></thead><tbody>
  ${ts.map(t => { const m = metricas(t, S.mes); return `<tr><td>${esc(titulo(t))}</td><td class="n">${nf1.format(m.aj.K)}</td><td class="n">${nf2.format(m.aj.Kusd)}</td><td class="n">${m.mt.o==null?'<span class="muted">sin ventas</span>':fPct(m.mt.o)}</td><td class="n">${nf1.format(m.aj.transf)}</td></tr>`; }).join('')}
  </tbody></table></div></section>`;
  const ff = Object.values(A.porFam).filter(f => f.merma || f.transf).sort((a,b)=>a.merma-b.merma);
  h += `<section class="sec"><div class="sec-h"><h2>Por familia</h2><p>Kg netos de merma y de transformación</p></div><div class="glass tw"><table><thead><tr><th>Familia</th><th>Grupo</th><th class="n">Merma kg</th><th class="n">Transformación kg</th></tr></thead><tbody>
  ${ff.map(f => { const cl = Core.famClase(f.fam); return `<tr><td><i class="dot" style="background:var(${CLASE_COLOR[cl]||'--sm'})"></i>${esc(famNombre(f.fam))}</td><td class="muted">${esc(CLASES[cl]?.nombre||'')}${Core.famCanal(f.fam)?'':' · fuera de canal'}</td><td class="n">${nf1.format(-f.merma)}</td><td class="n">${nf1.format(f.transf)}</td></tr>`; }).join('')}
  </tbody></table></div></section></div>
  <div class="glass note"><span><b>Qué cuenta como merma:</b> solo los motivos con tratamiento Merma (hoy avería, merma desconocida, merma natural y pérdida desconocida), netos de sus entradas. Donación, comida al personal y promo mercadeo son consumo operativo. Transformación de producción y cruce de códigos mueven kilos entre códigos y no son merma.</span>
  <span>El reporte trae un rango de fechas, no la fecha de cada movimiento: los ajustes se asignan al mes de la fecha "Hasta". Si cargas un rango que se solapa con uno anterior de la misma tienda, el nuevo lo reemplaza.</span></div>`;
  $('#view').innerHTML = h;
}

/* ---------- Cruce ---------- */
function vCruce(){
  const R = REF();
  const ts = TIENDAS.filter(t => inT(t,S.tienda) && (S.ventas.some(r=>r.t===t) || S.despostes.some(d=>d.tienda===t)));
  const filas = ts.map(t => { const m = metricas(t, S.mes); const rend = m.D.rend ?? R.rend;
    const actasUsadas = m.D.n ? m.actas : S.despostes; const huesoEnActas = actasUsadas.some(d => d.hijos.some(hh => famDesp(hh)==='HUESO' && hh.precio > 0));
    const kgVend = sum(Object.values(m.av.porFam).filter(f => Core.famCanal(f.fam) && (huesoEnActas || f.fam !== 'HUESO')), f => f.kv);
    const prod = rend != null ? m.av.padres.kg * rend : null;
    const disp = prod != null ? prod - Math.max(0, m.aj.K) - Math.max(0, m.aj.consumo) + m.aj.transf : null;
    return { t, m, rend, fuente: m.D.n ? 'tienda' : 'ref', prod, disp, kgVend, idx: disp ? kgVend/disp : null }; }).filter(x => x.m.av.padres.kg || x.kgVend);
  let h = `<section class="sec"><div class="sec-h"><h2>Cruce compra · desposte · Kardex · venta</h2><p>${fMes(S.mes)} · ¿cuánto de la canal comprada llegó a caja?</p></div>
  <div class="glass tw"><table><thead><tr><th>Tienda</th><th class="n">Kg comprados</th><th class="n">Rend. acta</th><th class="n">Kg vendibles</th><th class="n">− Merma Kardex</th><th class="n">− Consumo op.</th><th class="n">± Transf.</th><th class="n">= Disponible</th><th class="n">Kg vendidos</th><th class="n">Realización</th><th class="n">Brecha kg</th></tr></thead><tbody>
  ${filas.map(x => `<tr><td>${esc(titulo(x.t))}</td><td class="n">${nf0.format(x.m.av.padres.kg)}</td><td class="n">${fPct(x.rend)}${x.fuente==='ref'?'<span class="muted">†</span>':''}</td><td class="n">${x.prod!=null?nf0.format(x.prod):'—'}</td><td class="n">${nf0.format(x.m.aj.K)}</td><td class="n">${nf0.format(x.m.aj.consumo)}</td><td class="n">${nf0.format(x.m.aj.transf)}</td><td class="n">${x.disp!=null?nf0.format(x.disp):'—'}</td><td class="n">${nf0.format(x.kgVend)}</td><td class="n">${x.idx==null?'—':`<span class="pill ${x.idx<0.85?'c':x.idx<0.95||x.idx>1.05?'w':'g'}">${fPct(x.idx)}</span>`}</td><td class="n">${x.disp!=null?nf0.format(x.disp-x.kgVend):'—'}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="glass note"><span><b>Cómo leerlo:</b> kg vendibles = kg de canal comprada × rendimiento del acta. Se restan la merma y el consumo operativo del Kardex y se suma la transformación neta (negativa cuando el producto sale a otra categoría). Realización = kg vendidos de familias de canal ÷ disponible. La brecha que queda es inventario en cava o mostrador y diferencias de pesaje; sin inventario inicial y final no se pueden separar.</span>
  <span>† Tienda sin actas en el período: usa el rendimiento de referencia de todas las actas (${fPct(R.rend)}). Si las actas registran el hueso dentro de la merma, el hueso vendido no se cuenta en kg vendidos. Sobre 100 % suele indicar inventario del mes anterior.</span></div></section>`;
  const dl = S.despostes.filter(d => inT(d.tienda,S.tienda) && inM(d.fecha,S.mes)); const tAct = new Set(dl.map(d=>d.tienda));
  const av = Core.aggVentas(S.ventas.filter(r => inT(r.t,S.tienda) && inM(r.f,S.mes) && tAct.has(r.t)), S.ov);
  const aj = Core.aggAjustes(S.ajustes.filter(r => tAct.has(r.t) && inM(r.hasta,S.mes)), S.ov, S.ovMot);
  const prod = {}; let kgProd = 0;
  dl.forEach(d => d.hijos.forEach(hh => { const f = famDesp(hh); if (['MERMA','GRASA'].includes(Core.famClase(f)) || !(hh.precio > 0)) return; prod[f] = (prod[f]||0) + hh.kg; kgProd += hh.kg; }));
  Object.values(aj.porFam).forEach(F => { if (!F.transf || !Core.famCanal(F.fam)) return; prod[F.fam] = (prod[F.fam]||0) + F.transf; kgProd += F.transf; });
  const vend = {}; let kgV = 0; Object.values(av.porFam).forEach(F => { if (!Core.famCanal(F.fam)) return; vend[F.fam] = F.kv; kgV += F.kv; });
  const fams = FAMILIAS.filter(f => prod[f.id] || vend[f.id]).map(f => f.id);
  h += `<div class="grid2"><section class="sec"><div class="sec-h"><h2>Mix producido vs. mix vendido</h2><p>% de los kg vendibles · ${tAct.size ? esc([...tAct].map(titulo).join(', ')) : 'sin actas'}</p></div><div class="glass pad">${kgProd&&kgV?`<div class="chartbox" style="height:${Math.max(240, fams.length*40)}px"><canvas id="cMix"></canvas></div>`:'<div class="empty">Se necesitan actas y ventas de la misma tienda y período.</div>'}</div></section>
  <section class="sec"><div class="sec-h"><h2>Detalle del mix</h2><p>Producido = actas + transformaciones del Kardex</p></div><div class="glass tw"><table><thead><tr><th>Familia</th><th class="n">Producido</th><th class="n">Vendido</th><th>Dif.</th></tr></thead><tbody>
  ${fams.map(f => { const p = kgProd ? (prod[f]||0)/kgProd : null, v = kgV ? (vend[f]||0)/kgV : null; return `<tr><td><i class="dot" style="background:var(${CLASE_COLOR[Core.famClase(f)]})"></i>${esc(famNombre(f))}</td><td class="n">${fPct(p)}</td><td class="n">${fPct(v)}</td><td>${p!=null&&v!=null?`<span class="pill ${Math.abs(v-p)<0.03?'n':'w'}">${fPP(v-p)}</span>`:'—'}</td></tr>`; }).join('')}
  </tbody></table></div></section></div>`;
  $('#view').innerHTML = h;
  if (kgProd && kgV) { const o = withTip(baseOpts(), c => ' ' + c.dataset.label + ': ' + nf1.format(c.raw) + '%'); o.indexAxis = 'y'; const x = o.scales.x; o.scales.x = { ...o.scales.y, ticks:{ ...o.scales.y.ticks, callback:v=>v+'%' } }; o.scales.y = x;
    chart('cMix', { type:'bar', data:{ labels: fams.map(famNombre), datasets:[
      { label:'Producido', data: fams.map(f => +((prod[f]||0)/kgProd*100).toFixed(1)), backgroundColor:cssv('--s1'), borderRadius:{ topRight:4, bottomRight:4 }, maxBarThickness:14 },
      { label:'Vendido', data: fams.map(f => +((vend[f]||0)/kgV*100).toFixed(1)), backgroundColor:cssv('--s2'), borderRadius:{ topRight:4, bottomRight:4 }, maxBarThickness:14 } ] }, options:o }); }
}

/* ---------- Carga ---------- */
function vCarga(){
  const cov = (rows, tf, fa, fb) => TIENDAS.map(t => { const r = rows.filter(x=>tf(x)===t); return r.length ? { t, n:r.length, a:r.reduce((m,x)=>fa(x)<m?fa(x):m,'9'), b:r.reduce((m,x)=>fb(x)>m?fb(x):m,'') } : null; }).filter(Boolean);
  const cv = cov(S.ventas, x=>x.t, x=>x.f, x=>x.f), ca = cov(S.ajustes, x=>x.t, x=>x.desde, x=>x.hasta);
  const covT = (rows, lbl) => `<table><thead><tr><th>Tienda</th><th class="n">${lbl}</th><th>Desde</th><th>Hasta</th></tr></thead><tbody>${rows.map(c=>`<tr><td>${esc(titulo(c.t))}</td><td class="n">${nf0.format(c.n)}</td><td class="num">${fFecha(c.a)}</td><td class="num">${fFecha(c.b)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Sin registros</td></tr>'}</tbody></table>`;
  const en = estadoNube(), cfg = Cloud.cfg || Cloud.draft || { url:'', key:'' };
  let h = `<section class="sec"><div class="sec-h"><h2>Guardado en Supabase</h2><p><span class="chip st-${en.cls}"><i class="dotst"></i>${en.txt}</span></p></div>
   <div class="glass pad" style="display:flex;flex-direction:column;gap:12px">
    ${Cloud.error?`<div class="note warn" style="border-radius:9px">${esc(Cloud.error)}</div>`:''}
    <div class="row" style="align-items:flex-end;gap:12px"><label class="flab" for="sbUrl">URL del proyecto<input class="mini wide" id="sbUrl" placeholder="https://xxxxxxxx.supabase.co" value="${esc(cfg.url)}" autocomplete="off"></label>
    <label class="flab" for="sbKey">Clave publicable (anon)<input class="mini wide" id="sbKey" placeholder="sb_publishable_… o eyJ…" value="${esc(cfg.key)}" autocomplete="off"></label></div>
    <div class="row"><button class="btn pri" id="sbOk">${Cloud.cfg?'Guardar y probar de nuevo':'Conectar y probar'}</button>${Cloud.cfg?`<button class="btn" id="sbSync">Reintentar y recargar desde Supabase</button><button class="btn" id="sbUp">Subir lo que hay en este navegador</button><button class="btn" id="sbOff">Desconectar este navegador</button>`:''}</div>
    <p class="muted" style="margin:0;font-size:.8rem">Antes de conectar, corre una vez el archivo <b>supabase_tablero_res.sql</b> en el SQL Editor de tu proyecto. La URL y la clave publicable están en el panel del proyecto, en la sección de API. La clave se guarda solo en este navegador. Con Supabase conectado, nada se borra: quitar un acta la marca como anulada y los ajustes reemplazados quedan como historial. La conexión funciona en la versión publicada en Netlify; la vista previa del chat no permite conexiones externas.</p>
   </div></section>
  <section class="sec"><div class="glass drop" id="drop"><h3>Arrastra aquí los archivos del mes</h3><p class="muted" style="margin:0">Actas de desposte en PDF (Reporte de Producción), ventas y compras (VentasxDpto) y ajustes (Ajustes de Kardex) en Excel. Puedes soltar varios a la vez; el tipo se reconoce solo.</p>
    <div class="row"><label class="btn pri" for="file">Elegir archivos</label><input id="file" type="file" multiple accept=".pdf,.xlsx,.xls,.csv" hidden></div>
    <p class="muted" style="margin:0;font-size:.8rem">Nada se duplica: un acta repetida (tienda, documento y fecha) se reemplaza; las ventas se actualizan por tienda + código + día; los ajustes de una tienda se reemplazan cuando el nuevo rango se solapa con el anterior.</p></div>
    ${S.log.length?`<div class="glass pad log">${S.log.map(l=>`<div><span class="pill ${l.ok?'g':'c'}">${l.ok?'Cargado':'Error'}</span><span>${l.msg}</span></div>`).join('')}</div>`:''}</section>
  <section class="sec"><div class="sec-h"><h2>Actas de desposte</h2><p>${S.despostes.length} cargada(s)</p></div><div class="glass tw"><table><thead><tr><th>Fecha</th><th>Tienda</th><th>Doc.</th><th class="n">Kg canal</th><th>Archivo</th><th></th></tr></thead><tbody>
  ${S.despostes.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(d=>`<tr><td class="num">${fFecha(d.fecha)}</td><td>${esc(titulo(d.tienda))}</td><td class="num">${esc(d.padres.map(p=>p.doc).join(', '))}</td><td class="n">${nf1.format(sum(d.padres,p=>p.kg))}</td><td class="muted" style="font-size:.8rem">${esc(d.fuente||'')}</td><td>${S.confirm===d.id?`<button class="btn dng" data-delok="${esc(d.id)}">Confirmar</button>`:`<button class="btn" data-del="${esc(d.id)}">Quitar</button>`}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Sin actas</td></tr>'}
  </tbody></table></div></section>
  <div class="grid2"><section class="sec"><div class="sec-h"><h2>Ventas y compras</h2><p>${nf0.format(S.ventas.length)} registros diarios</p></div><div class="glass tw">${covT(cv,'Registros')}</div></section>
  <section class="sec"><div class="sec-h"><h2>Ajustes de Kardex</h2><p>${nf0.format(S.ajustes.length)} movimientos</p></div><div class="glass tw">${covT(ca,'Movimientos')}</div></section></div>
  ${Cloud.cfg ? '' : `<section class="sec"><div class="sec-h"><h2>Datos de este navegador</h2><p>Sin Supabase, los datos viven solo aquí. Datos iniciales: archivos del ${esc(fFecha(SEED.fecha))}.</p></div><div class="row">
   ${S.confirm==='__reset'?`<button class="btn dng" id="resetOk">Sí, volver a los datos iniciales</button><button class="btn" id="cancel">Cancelar</button>`:`<button class="btn" id="reset">Volver a los datos iniciales</button>`}
   ${S.confirm==='__wipe'?`<button class="btn dng" id="wipeOk">Sí, borrar todo</button><button class="btn" id="cancel2">Cancelar</button>`:`<button class="btn dng" id="wipe">Borrar todos los datos</button>`}</div></section>`}`;
  $('#view').innerHTML = h;
  const drop = $('#drop');
  ['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('on'); }));
  ['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('on'); }));
  drop.addEventListener('drop', ev => ingest([...ev.dataTransfer.files]));
  $('#file').onchange = ev => ingest([...ev.target.files]);
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.confirm = b.dataset.del; vCarga(); });
  document.querySelectorAll('[data-delok]').forEach(b => b.onclick = async () => { const id = b.dataset.delok; S.despostes = S.despostes.filter(d=>d.id!==id); S.confirm=null; dirty(); await save(); await nube({ k:'anular', id }); fillFilters(); render(); });
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('sbOk', conectarNube);
  on('sbSync', async () => { await cargarNube(); fillFilters(); render(); });
  on('sbUp', async () => { try { Cloud.estado='conectando'; pintarEstado(); await subirTodo(); S.log.unshift({ ok:true, msg:'Subí a Supabase todo lo que había en este navegador (actas, ventas, ajustes y configuración). Lo que ya existía no se duplicó.' }); await cargarNube(); } catch(e) { Cloud.estado='error'; Cloud.error=e.message; } fillFilters(); render(); });
  on('sbOff', () => { try { localStorage.removeItem('tablero-res-sb'); } catch(e){} Cloud.cfg = null; Cloud.estado = 'local'; Cloud.error = ''; fillFilters(); render(); });
  on('reset', () => { S.confirm='__reset'; vCarga(); }); on('wipe', () => { S.confirm='__wipe'; vCarga(); });
  on('cancel', () => { S.confirm=null; vCarga(); }); on('cancel2', () => { S.confirm=null; vCarga(); });
  on('resetOk', async () => { seedState(); S.ov={}; S.ovMot={}; S.est={}; S.confirm=null; S.log=[{ok:true,msg:'Datos iniciales restaurados.'}]; dirty(); await save(); fillFilters(); render(); });
  on('wipeOk', async () => { S.despostes=[]; S.ventas=[]; S.ajustes=[]; S.confirm=null; S.log=[{ok:true,msg:'Se borraron actas, ventas y ajustes.'}]; dirty(); await save(); fillFilters(); render(); });
}
async function conectarNube(){
  const url = limpiaUrl($('#sbUrl').value), key = $('#sbKey').value.trim(); Cloud.draft = { url, key };
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url)) { Cloud.error = 'La URL debe verse como https://xxxxxxxx.supabase.co'; return vCarga(); }
  if (key.length < 20) { Cloud.error = 'Pega la clave publicable completa (empieza con sb_publishable_ o con eyJ).'; return vCarga(); }
  const prev = Cloud.cfg; Cloud.cfg = { url, key }; Cloud.estado = 'conectando'; pintarEstado();
  try {
    await Cloud.req('res_config?select=clave&limit=1');
    const [d1, v1, a1] = await Promise.all([Cloud.req('res_despostes?select=id&limit=1'), Cloud.req('res_ventas?select=tienda&limit=1'), Cloud.req('res_ajustes?select=id&limit=1')]);
    try { localStorage.setItem('tablero-res-sb', JSON.stringify(Cloud.cfg)); } catch(e){}
    if (!d1.length && !v1.length && !a1.length && (S.despostes.length || S.ventas.length || S.ajustes.length)) { await subirTodo(); S.log.unshift({ ok:true, msg:'Supabase estaba vacío: subí lo que había en este navegador.' }); }
    await cargarNube(); if (Cloud.estado === 'ok') S.log.unshift({ ok:true, msg:`Conectado a Supabase · ${S.despostes.length} acta(s), ${nf0.format(S.ventas.length)} ventas y ${nf0.format(S.ajustes.length)} ajustes leídos.` });
  } catch(e) { Cloud.cfg = prev; Cloud.estado = prev ? 'error' : 'local'; Cloud.error = e.message; }
  fillFilters(); render();
}
let pdfReady = null;
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar el lector de PDF. Revisa la conexión e intenta de nuevo.')); document.head.appendChild(s); }); }
function ensurePdf(){ return pdfReady ||= (async () => { const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/'; await loadScript(base+'pdf.min.js'); await loadScript(base+'pdf.worker.min.js'); window.pdfjsLib.GlobalWorkerOptions.workerSrc = base+'pdf.worker.min.js'; })().catch(e => { pdfReady = null; throw e; }); }
async function leerPDF(file){
  await ensurePdf(); const doc = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; const items = [];
  for (let p = 1; p <= doc.numPages; p++) { const tc = await (await doc.getPage(p)).getTextContent(); tc.items.forEach(i => items.push({ p, x:i.transform[4], y:i.transform[5], w:i.width, s:i.str })); }
  return Core.parseDesposte(items, file.name);
}
function dirty(){ precioCache.clear(); REFc = null; }
function nubeLog(r, n){ if (r == null) return; const suf = r ? ' · <b>guardado en Supabase</b>' : ' · <b>sin subir a Supabase</b>: queda en cola y se reintenta'; for (let i = 0; i < n && S.log[i]; i++) S.log[i].msg += suf; }
async function ingest(files){
  for (const f of files) {
    try {
      if (/\.pdf$/i.test(f.name)) {
        const ds = await leerPDF(f); if (!ds.length) throw new Error('no encontré un Reporte de Producción en el PDF');
        ds.forEach(d => { const i = S.despostes.findIndex(x=>x.id===d.id); if (i>=0) S.despostes[i] = d; else S.despostes.push(d);
          const k = Core.kpiDesposte(d, {}); S.log.unshift({ ok:true, msg:`<b>${esc(f.name)}</b> · acta ${esc(titulo(d.tienda))} ${fFecha(d.fecha)} · <span class="num">${fKg(k.kgPadre)}</span> · rend. <span class="num">${fPct(k.rendVend)}</span> · ${i>=0?'reemplazada':'nueva'}${d.avisos.length?` · <b>avisos:</b> ${esc(d.avisos.join('; '))}`:''}` }); });
        nubeLog(await nube({ k:'desp', rows:ds }), ds.length); nube({ k:'log', row:{ archivo:f.name, tipo:'DESPOSTE', detalle:ds.map(d=>d.id).join(', '), filas:ds.length } });
      } else {
        const wb = XLSX.read(await f.arrayBuffer(), { cellDates:true }); const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true });
        const tipo = Core.tipoExcel(aoa);
        if (tipo === 'AJUSTES') {
          const rows = Core.parseAjustes(aoa); if (!rows.length) throw new Error('el reporte no trae movimientos');
          const ts = new Set(rows.map(r=>r.t)); const { desde, hasta } = rows[0]; const antes = S.ajustes.length;
          S.ajustes = S.ajustes.filter(r => !(ts.has(r.t) && r.desde <= hasta && r.hasta >= desde)); const quit = antes - S.ajustes.length;
          S.ajustes.push(...rows);
          S.log.unshift({ ok:true, msg:`<b>${esc(f.name)}</b> · ajustes de Kardex ${fFecha(desde)} al ${fFecha(hasta)} · ${nf0.format(rows.length)} movimientos · ${ts.size} tienda(s)${quit?` · reemplazó ${nf0.format(quit)} movimientos del rango anterior`:''}` });
          nubeLog(await nube({ k:'aj', desde, hasta, archivo:f.name, filas:rows.map(filaAj) }), 1); nube({ k:'log', row:{ archivo:f.name, tipo:'AJUSTES', detalle:`${desde} a ${hasta}`, filas:rows.length } });
        } else if (tipo === 'VENTAS') {
          const rows = Core.parseVentas(aoa); if (!rows.length) throw new Error('el archivo no trae filas de venta');
          const key = r => r.t+'|'+r.c+'|'+r.f; const m = new Map(S.ventas.map(r=>[key(r), r])); let nuevos = 0, act = 0;
          rows.forEach(r => { if (m.has(key(r))) act++; else nuevos++; m.set(key(r), r); }); S.ventas = [...m.values()];
          const tt = [...new Set(rows.map(r=>r.t))]; const fa = rows.reduce((x,r)=>r.f<x?r.f:x,'9'), fb = rows.reduce((x,r)=>r.f>x?r.f:x,'');
          S.log.unshift({ ok:true, msg:`<b>${esc(f.name)}</b> · ventas y compras · ${nf0.format(rows.length)} filas · ${tt.length} tienda(s) · ${fFecha(fa)} al ${fFecha(fb)} · ${nuevos} nuevas, ${act} actualizadas` });
          nubeLog(await nube({ k:'ven', rows }), 1); nube({ k:'log', row:{ archivo:f.name, tipo:'VENTAS', detalle:`${fa} a ${fb}`, filas:rows.length } });
        } else throw new Error('no reconozco el Excel: espero VentasxDpto (Tienda, Codigo, Cant. Venta) o Ajustes de Kardex (Motivo, Tienda, Cant.)');
      }
    } catch (e) { S.log.unshift({ ok:false, msg:`<b>${esc(f.name)}</b> · ${esc(e.message)}` }); }
  }
  dirty(); await save(); fillFilters(); render();
}

/* ---------- Catálogo ---------- */
function vCatalogo(){
  const arts = new Map();
  S.ventas.forEach(r => { if (!arts.has(r.c)) arts.set(r.c, { c:r.c, a:r.a, sub:'' }); });
  S.ajustes.forEach(r => { const x = arts.get(r.c); if (!x) arts.set(r.c, { c:r.c, a:r.a, sub:r.sub }); else if (!x.sub) x.sub = r.sub; });
  const lista = [...arts.values()].sort((x,y)=>x.c.localeCompare(y.c));
  const dnames = [...new Set(S.despostes.flatMap(d=>d.hijos.map(h=>norm(h.art))))].sort();
  const opts = (sel, padre) => `<option value="">Regla automática</option>${padre?`<option value="PADRE"${sel==='PADRE'?' selected':''}>Padre (materia prima)</option>`:''}${FAMILIAS.map(f=>`<option value="${f.id}"${sel===f.id?' selected':''}>${esc(f.nombre)}</option>`).join('')}<option value="EXCLUIR"${sel==='EXCLUIR'?' selected':''}>Excluir del análisis</option>`;
  const padres = [...new Set(S.despostes.map(padreD))];
  const motivos = [...new Set(S.ajustes.map(r=>r.mot))].sort();
  let h = `<section class="sec"><div class="sec-h"><h2>Fórmulas de negocio</h2><p>Cómo se calcula cada indicador</p></div><div class="glass pad fgrid">
   <div><h3>% rendimiento por corte</h3><div class="formula">Rend_i = kg_i / kg_padre × 100</div><p>kg_padre = suma de "Productos a utilizar" del acta.</p></div>
   <div><h3>Rendimiento del acta y merma técnica</h3><div class="formula">Rend_acta = Σ kg vendibles / kg_padre
t = kg de merma, grasa y cortes sin precio / kg_padre</div><p>Cuadre: kg_padre − Σ hijos = 0.</p></div>
   <div><h3>Merma operativa (Kardex)</h3><div class="formula">K = −Σ kg netos de motivos de merma (familias de canal)
o = K / (kg vendidos de canal + K)</div><p>Parte del producto ya despostado que se pierde antes de llegar a caja.</p></div>
   <div><h3>Merma total y rendimiento neto</h3><div class="formula">Rend_neto   = (1 − t) × (1 − o)
Merma_total = 1 − Rend_neto = t + (1 − t) × o</div><p>Se combinan tasas porque actas y Kardex no cubren los mismos kilos.</p></div>
   <div><h3>Costo por valor relativo de venta (VRV)</h3><div class="formula">f = Costo_padre / Σ (kg_j × PMVP_j)
Costo_i $/kg = PMVP_i × f
Margen PMVP = 1 − f   (igual en todos los cortes)</div><p>Es el método del ERP (acta Pirineos: 22,9 % uniforme).</p></div>
   <div><h3>Utilidad por grupo</h3><div class="formula">Utilidad_g = Σ kg_i × (Precio_i − Costo_i)
Precio = PMVP del acta o venta $/kg de la familia (tienda, mes)</div><p>Margen = Utilidad / Venta.</p></div>
   <div><h3>Utilidad y margen bruto en caja</h3><div class="formula">Utilidad = Subtotal venta − Costo venta (ERP)
Margen %  = Utilidad / Subtotal venta</div><p>Coincide con la columna Margen del VentasxDpto.</p></div>
   <div><h3>Realización</h3><div class="formula">Disponible = Kg comprados × Rend_acta − K − Consumo ± Transf.
Realización = Kg vendidos de canal / Disponible</div><p>Unidades a kg con el peso del nombre (croqueta 400 g = 0,4 kg).</p></div>
  </div></section>`;
  h += `<div class="grid2"><section class="sec"><div class="sec-h"><h2>Motivos de ajuste de Kardex</h2><p>Define qué entra en la merma</p></div><div class="glass tw"><table><thead><tr><th>Motivo</th><th>Tratamiento</th></tr></thead><tbody>
   ${motivos.map(m => { const cl = Core.motivoClase(m, S.ovMot); return `<tr><td>${esc(m)}</td><td><select class="mini" id="mot-${esc(norm(m).replace(/\W/g,'_'))}" data-mot="${esc(norm(m))}">${Object.entries(MOTIVO_CLASES).map(([k,v])=>`<option value="${k}"${cl===k?' selected':''}>${v.nombre}${v.merma?' (cuenta como merma)':''}</option>`).join('')}</select></td></tr>`; }).join('')||'<tr><td colspan="2" class="muted">Sin ajustes cargados</td></tr>'}
  </tbody></table></div></section>
  <section class="sec"><div class="sec-h"><h2>Estándar teórico de rendimiento</h2><p>% sobre kg de padre · vacío = promedio de todas las actas</p></div><div class="glass tw"><table><thead><tr><th>Familia</th>${padres.map(p=>`<th class="n">${esc((Core.PADRES.find(x=>x.id===p)||{nombre:p}).nombre)}</th>`).join('')}</tr></thead><tbody>
   ${FAMILIAS.filter(f => f.canal).map(f => `<tr><td><i class="dot" style="background:var(${CLASE_COLOR[f.clase]})"></i>${esc(f.nombre)}</td>${padres.map(p => { const e = estandar(p).fams[f.id]; const man = S.est[p]?.[f.id]; return `<td class="n"><input class="mini" id="est-${p}-${f.id}" data-p="${p}" data-f="${f.id}" inputmode="decimal" value="${man??''}" placeholder="${e&&e.src==='hist'?nf2.format(e.pct*100):''}" aria-label="Estándar ${esc(f.nombre)}"></td>`; }).join('')}</tr>`).join('')}
  </tbody></table></div></section></div>`;
  h += `<div class="grid2"><section class="sec"><div class="sec-h"><h2>Artículos de venta, compra y ajustes</h2><p>${lista.length} códigos · la regla asigna por nombre y subgrupo</p></div><div class="glass tw"><table><thead><tr><th>Código</th><th>Artículo</th><th>Asignación</th><th>Origen</th></tr></thead><tbody>
   ${lista.map(x => { const k = Core.clasificarArticulo(x, S.ov); const lbl = k.rol==='PADRE'?'Padre':k.rol==='EXCLUIDO'?'Excluido':famNombre(k.fam); return `<tr><td class="num">${esc(x.c)}</td><td>${esc(x.a)}</td><td><select class="mini" id="ov-${esc(x.c)}" data-ov="${esc(x.c)}">${opts(S.ov[x.c]||'', true)}</select></td><td>${k.origen==='manual'?'<span class="pill n">manual</span>':k.rol==='SIN_MAPEO'?'<span class="pill c">pendiente</span>':`<span class="muted" style="font-size:.8rem">${esc(lbl)}</span>`}</td></tr>`; }).join('')}
   </tbody></table></div></section>
   <section class="sec"><div class="sec-h"><h2>Cortes del acta de desposte</h2><p>El PDF no trae código: se asigna por nombre</p></div><div class="glass tw"><table><thead><tr><th>Producto terminado</th><th>Asignación</th><th>Por regla</th></tr></thead><tbody>
   ${dnames.map(n => `<tr><td>${esc(n)}</td><td><select class="mini" id="ovd-${esc(n.replace(/\W/g,'_'))}" data-ovd="${esc(n)}">${opts(S.ov['D:'+n]||'', false)}</select></td><td class="muted" style="font-size:.8rem">${esc(famNombre(Core.familiaPorRegla(n)))}</td></tr>`).join('')}
   </tbody></table></div>
   <div class="glass note"><span><b>Grupos:</b> siguen el SubGrupo del ERP. Especiales = lomito, solomo, punta, lomo de aguja y pollo de res. Primera = primera, bistec, pulpa negra, muchacho, ganso y mechar. Segunda = segunda, lagarto, molida y guisar. Tercera = costilla, asado de tira, osobuco y hueso. Los cortes Disprocar y las vísceras no salen del desposte de canal y quedan fuera del rendimiento.</span><span><b>Supuesto a validar:</b> pollo de res va en Especiales.</span></div></section></div>`;
  $('#view').innerHTML = h;
  document.querySelectorAll('[data-ov]').forEach(s => s.onchange = async () => { if (s.value) S.ov[s.dataset.ov] = s.value; else delete S.ov[s.dataset.ov]; dirty(); await save(); nube({ k:'cfg' }); vCatalogo(); });
  document.querySelectorAll('[data-ovd]').forEach(s => s.onchange = async () => { const k = 'D:'+s.dataset.ovd; if (s.value) S.ov[k] = s.value; else delete S.ov[k]; dirty(); await save(); nube({ k:'cfg' }); vCatalogo(); });
  document.querySelectorAll('[data-mot]').forEach(s => s.onchange = async () => { S.ovMot[s.dataset.mot] = s.value; dirty(); await save(); nube({ k:'cfg' }); });
  document.querySelectorAll('input[data-p]').forEach(i => i.onchange = async () => { const v = i.value.replace(',', '.').trim(); S.est[i.dataset.p] ||= {}; if (v === '' || isNaN(+v)) delete S.est[i.dataset.p][i.dataset.f]; else S.est[i.dataset.p][i.dataset.f] = +v; await save(); nube({ k:'cfg' }); });
}

/* ---------- Marco ---------- */
function fillFilters(){
  const ts = TIENDAS.filter(t => S.ventas.some(r=>r.t===t) || S.despostes.some(d=>d.tienda===t) || S.ajustes.some(r=>r.t===t));
  const ms = [...new Set(S.ventas.map(r=>mesDe(r.f)).concat(S.despostes.map(d=>mesDe(d.fecha)), S.ajustes.map(r=>mesDe(r.hasta))))].filter(Boolean).sort().reverse();
  if (S.tienda !== '*' && !ts.includes(S.tienda)) S.tienda = '*';
  if (S.mes !== '*' && !ms.includes(S.mes)) S.mes = '*';
  $('#fTienda').innerHTML = `<option value="*">Consolidado cadena</option>` + ts.map(t=>`<option value="${esc(t)}">${esc(titulo(t))}</option>`).join('');
  $('#fMes').innerHTML = `<option value="*">Todo lo cargado</option>` + ms.map(m=>`<option value="${m}">${fMes(m)}</option>`).join('');
  $('#fTienda').value = S.tienda; $('#fMes').value = S.mes;
  const fb = S.ventas.reduce((m,r)=>r.f>m?r.f:m,'');
  $('#stamp').innerHTML = `Ventas al <b>${fFecha(fb)}</b> · <b>${S.despostes.length}</b> acta(s) · <b>${nf0.format(S.ajustes.length)}</b> ajustes`;
  pintarEstado();
}
function render(){
  $('#tabs').innerHTML = VIEWS.map(([k,l]) => `<button class="tab" role="tab" id="tab-${k}" aria-selected="${S.tab===k}" data-k="${k}">${l}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.k; S.confirm = null; saveUI(); render(); });
  redraw(({ panel:vPanel, canal:vCanal, despostes:vDespostes, mensual:vMensual, kardex:vKardex, cruce:vCruce, carga:vCarga, catalogo:vCatalogo }[S.tab] || vPanel));
}
$('#fTienda').onchange = e => { S.tienda = e.target.value; if (S.tienda !== '*' && S.despostes.some(d=>d.tienda===S.tienda)) S.canal = S.tienda; render(); };
$('#fMes').onchange = e => { S.mes = e.target.value; render(); };
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render()); } catch(e){}
new MutationObserver(() => render()).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
/* ---------- Instalar como app (PWA) ---------- */
(() => {
  const btn = $('#btnInstalar'), tip = $('#tipIOS'); let aviso = null;
  const instalada = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); aviso = e; if (!instalada()) btn.hidden = false; });
  window.addEventListener('appinstalled', () => { btn.hidden = true; aviso = null; });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !instalada() && location.protocol === 'https:') btn.hidden = false;
  btn.onclick = async () => { if (aviso) { aviso.prompt(); await aviso.userChoice; aviso = null; btn.hidden = true; } else tip.hidden = !tip.hidden; };
})();
(async () => { Cloud.init(); seedState(); fillFilters(); render(); await load(); Cloud.pend = (await DB.get('pend')) || []; dirty(); fillFilters(); render();
  if (Cloud.cfg) { await cargarNube(); fillFilters(); render(); } })();
})();
